name: Deploy ygkkk VLESS to new Worker
on:
  push:
    branches: [main]
    paths:
      - 'Vless_workers_pages/_worker.js'
      - 'wrangler.ygkkk.jsonc'
      - '.github/workflows/deploy-ygkkk.yml'
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Inject UUID from secret
        env:
          WORKER_UUID: ${{ secrets.WORKER_UUID }}
        run: |
          test -n "$WORKER_UUID" || { echo "WORKER_UUID secret is empty"; exit 1; }
          grep -q '86c50e3a-5b87-49dd-bd20-03c7f2735e40' Vless_workers_pages/_worker.js || { echo "default UUID not found, upstream file may have changed"; exit 1; }
          sed -i "s/86c50e3a-5b87-49dd-bd20-03c7f2735e40/$WORKER_UUID/g" Vless_workers_pages/_worker.js
          echo "UUID injected, default placeholder replaced"
      - name: Deploy with wrangler
        run: npx --yes wrangler@4.119.0 deploy --config wrangler.ygkkk.jsonc
